<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're offline - Mpahira</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f8f9fa;
            color: #212529;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .offline-box { padding: 24px; max-width: 360px; }
        .offline-logo { width: 96px; height: 96px; border-radius: 20px; margin-bottom: 16px; }
        h1 { font-size: 1.25rem; margin-bottom: 8px; }
        p { color: #6c757d; margin-bottom: 20px; }
        button {
            background: #2f9e44;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="offline-box">
        <img class="offline-logo" src="assets/images/icon-192.png" alt="Mpahira">
        <h1>You're offline</h1>
        <p>Check your internet connection and try again.</p>
        <button onclick="window.location.reload()">Retry</button>
    </div>
</body>
</html>
